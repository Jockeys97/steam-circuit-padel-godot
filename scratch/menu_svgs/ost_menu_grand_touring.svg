<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="showroom_wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floor_marble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="softbox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="car_body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Showroom Background -->
  <rect width="1024" height="1024" fill="url(#showroom_wall)"/>

  <!-- Ceiling Diffuser Softbox Lighting -->
  <polygon points="260,0 764,0 710,180 314,180" fill="url(#softbox)" opacity="0.6"/>
  <rect x="330" y="20" width="364" height="130" rx="8" fill="#ffffff" opacity="0.9" stroke="#38bdf8" stroke-width="4"/>

  <!-- Floor Horizon & Marble -->
  <rect x="0" y="520" width="1024" height="504" fill="url(#floor_marble)"/>
  <line x1="0" y1="520" x2="1024" y2="520" stroke="#475569" stroke-width="2"/>

  <!-- Marble Reflection of Softbox -->
  <polygon points="314,520 710,520 764,700 260,700" fill="#38bdf8" opacity="0.08"/>

  <!-- Luxury Supercar Profile Silhouette -->
  <!-- Car Shadow -->
  <ellipse cx="512" cy="625" rx="360" ry="25" fill="#000000" opacity="0.85"/>

  <!-- Car Bodywork (Sleek Gran Turismo GT3 silhouette) -->
  <path d="M 180,600 C 220,580 310,565 370,545 C 440,515 570,515 650,540 C 730,555 810,585 840,600 C 820,612 770,615 720,615 C 670,615 620,590 570,590 C 520,590 470,615 410,615 C 350,615 300,590 250,590 C 200,590 170,605 180,600 Z" fill="url(#car_body)" stroke="#7dd3fc" stroke-width="3"/>

  <!-- Glass Cockpit & Canopy -->
  <path d="M 390,545 C 440,522 530,520 590,528 C 630,534 650,545 650,545 C 580,542 470,543 390,545 Z" fill="#0f172a" stroke="#bae6fd" stroke-width="2"/>

  <!-- Wheels & Rims -->
  <!-- Front Wheel -->
  <circle cx="290" cy="605" r="42" fill="#020617" stroke="#94a3b8" stroke-width="6"/>
  <circle cx="290" cy="605" r="24" fill="#334155" stroke="#38bdf8" stroke-width="3"/>
  <!-- Rear Wheel -->
  <circle cx="730" cy="605" r="42" fill="#020617" stroke="#94a3b8" stroke-width="6"/>
  <circle cx="730" cy="605" r="24" fill="#334155" stroke="#38bdf8" stroke-width="3"/>

  <!-- Laser Taillight Streak -->
  <path d="M 810,585 L 835,595" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <line x1="835" y1="595" x2="890" y2="598" stroke="#f87171" stroke-width="2" opacity="0.7"/>

