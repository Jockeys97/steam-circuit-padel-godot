<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <radialGradient id="ironBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2b1509"/>
      <stop offset="50%" stop-color="#140a04"/>
      <stop offset="100%" stop-color="#050201"/>
    </radialGradient>
    <linearGradient id="bronzeGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a96d"/>
      <stop offset="50%" stop-color="#99582a"/>
      <stop offset="100%" stop-color="#432818"/>
    </linearGradient>
    
  </defs>

  <rect width="1024" height="1024" fill="url(#ironBg)"/>

  <!-- Piston Steam Release Jets -->
  <polygon points="512,380 300,120 360,100" fill="#ffffff" fill-opacity="0.2" filter="url(#glow)"/>
  <polygon points="512,380 724,120 664,100" fill="#ffffff" fill-opacity="0.2" filter="url(#glow)"/>

  <!-- Colossal Steampunk Cogwheel -->
  <g filter="url(#softGlow)">
    <circle cx="512" cy="380" r="140" fill="url(#bronzeGear)" stroke="#e0a96d" stroke-width="4"/>
    <rect x="627.0" y="365.0" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(0.0 642.0 380.0)"/><rect x="609.6" y="430.0" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(30.0 624.6 445.0)"/><rect x="562.0" y="477.6" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(60.0 577.0 492.6)"/><rect x="497.0" y="495.0" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(90.0 512.0 510.0)"/><rect x="432.0" y="477.6" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(120.0 447.0 492.6)"/><rect x="384.4" y="430.0" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(150.0 399.4 445.0)"/><rect x="367.0" y="365.0" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(180.0 382.0 380.0)"/><rect x="384.4" y="300.0" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(210.0 399.4 315.0)"/><rect x="432.0" y="252.4" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(240.0 447.0 267.4)"/><rect x="497.0" y="235.0" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(270.0 512.0 250.0)"/><rect x="562.0" y="252.4" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(300.0 577.0 267.4)"/><rect x="609.6" y="300.0" width="30" height="30" rx="4" fill="#e0a96d" transform="rotate(330.0 624.6 315.0)"/>
    <circle cx="512" cy="380" r="75" fill="#140a04" stroke="#ff5400" stroke-width="3"/>
  </g>

  <!-- Pressure Gauge in red zone -->
  <g transform="translate(512, 380)">
    <circle cx="0" cy="0" r="50" fill="#080402" stroke="#e0a96d" stroke-width="3"/>
    <!-- Red warning arc -->
    <path d="M 0,-40 A 40 40 0 0 1 35,-15" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Needle pointing at MAX -->
    <line x1="0" y1="0" x2="30" y2="-25" stroke="#ffcc00" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#e0a96d"/>
  </g>
    
  <!-- Title Badge inside disc radius -->
  <rect x="200" y="675" width="624" height="40" rx="20" fill="#080d1a" fill-opacity="0.92" stroke="#e0a96d" stroke-width="2.5" filter="url(#softGlow)"/>
  <text x="512" y="701" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#e0a96d" text-anchor="middle" letter-spacing="3">INDUSTRIAL STEAMPUNK METAL</text>

  <!-- Title in bold high-contrast typography -->
  <text x="512" y="768" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3" filter="url(#glow)">IRON JUGGERNAUT</text>
  <text x="512" y="768" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffaa00" text-anchor="middle" letter-spacing="3">IRON JUGGERNAUT</text>

  <!-- Lore tag below -->
  <text x="512" y="805" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#90e0ef" text-anchor="middle" letter-spacing="2">MECHA BOSS • FOUNDRY POWER CLIMAX</text>
</svg>