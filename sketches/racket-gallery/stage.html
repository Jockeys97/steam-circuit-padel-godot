<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Steam Circuit Padel: pick your racket</title>
<style>
  /* ------------------------------------------------------------------
     Steam Circuit Padel, racket gallery spike.
     Kernel DNA: arcade pop plus vetro glass, cream and tangerine slabs,
     thick soft outlines, generous radii, soft shadows, light 2026 page.
     ------------------------------------------------------------------ */

  :root{
    --paper:#fff3dc;
    --paper-deep:#ffe3b4;
    --screen:#fefefe;
    --ink:#26190e;
    --ink-70:rgba(38,25,14,.7);
    --ink-45:rgba(38,25,14,.45);
    --ink-12:rgba(38,25,14,.12);
    --gold:#ffcc00;
    --cyan:#00e5ff;
    --lime:#c9f77e;
    --persimmon:#e24a1c;
    --tangerine:#ff9f2b;
    --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif;
    --r-xl:36px; --r-lg:26px; --r-md:18px; --r-pill:999px;
    --line:3px solid var(--ink);
    --lift:0 30px 54px -32px rgba(38,25,14,.75);
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    overflow-x:hidden;
    color:var(--ink);
    font-family:var(--font);
    font-size:16px;
    line-height:1.35;
    background:
      radial-gradient(120% 78% at 50% -12%, #fff9ec 0%, var(--paper) 42%, var(--paper-deep) 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  button{ font:inherit; color:inherit; }

  :focus-visible{ outline:3px solid var(--cyan); outline-offset:3px; border-radius:var(--r-pill); }

  .sr{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0;
  }

  .app{
    display:flex; flex-direction:column;
    gap:10px;
    min-height:100dvh;
    max-width:820px;
    margin:0 auto;
    padding: max(10px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  }

  /* ---------------------------------------------------------- top bar */

  .bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }

  .mark{
    margin:0; font-size:14px; font-weight:700; letter-spacing:.01em;
    color:var(--ink-70);
  }

  /* ------------------------------------------------- segmented control */

  .seg{
    display:inline-flex; gap:3px; padding:3px;
    border-radius:var(--r-pill);
    background:rgba(255,255,255,.62);
    box-shadow:0 0 0 2px var(--ink-12), inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(14px) saturate(1.5);
    backdrop-filter:blur(14px) saturate(1.5);
  }

  @supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
    .seg{ background:rgba(255,255,255,.9); }
  }

  .opt{
    -webkit-appearance:none; appearance:none;
    border:0; background:transparent; cursor:pointer;
    border-radius:var(--r-pill);
    padding:8px 15px;
    font-size:15px; font-weight:650; letter-spacing:.005em;
    color:var(--ink-70);
    transition:none;
  }

  .opt[aria-checked="true"]{ background:var(--ink); color:#fff6e4; }

  /* vetro variant: the customize chips are glass, tinted cyan when picked */
  .seg.vetro{ width:100%; max-width:100%; justify-content:stretch; gap:4px; }
  .seg.vetro .opt{ flex:1 1 0; min-width:0; padding:6.5px 8px; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .seg.vetro .opt[aria-checked="true"]{
    background:linear-gradient(160deg,#e2fbff,#9deeff);
    color:var(--ink);
    box-shadow:0 0 0 2px rgba(255,255,255,.95), 0 6px 14px -8px rgba(0,170,215,.95);
  }

  /* ------------------------------------------------------- the stage */

  .stage-zone{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; gap:6px;
    padding-top:2px;
  }

  .stage{
    position:relative;
    flex:1 1 auto; min-height:238px;
    display:grid; place-items:center;
    padding:2px 0 8px;
    perspective:1100px;
    perspective-origin:50% 42%;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    cursor:grab;
  }

  .stage.is-dragging{ cursor:grabbing; }

  .plinth{
    position:relative;
    height:100%; max-height:100%;
    width:min(100%,440px);
    border-radius:var(--r-xl);
    background:linear-gradient(158deg,#ffc65c 0%, var(--tangerine) 52%, #ffb84c 100%);
    box-shadow:
      0 0 0 3px var(--ink),
      var(--lift),
      inset 0 2px 0 rgba(255,255,255,.6),
      inset 0 -4px 0 rgba(38,25,14,.10);
  }

  .plinth::after{
    /* quiet gold sun, peeking out from the top corners */
    content:"";
    position:absolute; left:50%; top:-26px; transform:translateX(-50%);
    width:min(84%,320px); aspect-ratio:1; border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,204,0,.72), rgba(255,204,0,0) 72%);
    z-index:-1;
  }

  .screen{
    position:absolute; inset:11px;
    border-radius:var(--r-lg);
    background:var(--screen);
    overflow:hidden;
    display:grid; place-items:center;
    box-shadow:inset 0 4px 12px rgba(38,25,14,.10);
  }

  .fig{
    position:absolute; inset:0;
    display:grid; place-items:center;
    transform-style:preserve-3d;
    will-change:transform;
  }

  .fig img{
    position:absolute; inset:0;
    display:block;
    width:100%; height:100%;
    object-fit:contain;
    opacity:1;
    transition:opacity .18s ease, transform .18s ease;
  }

  .fig img.swapping{ opacity:.25; transform:scale(.985); }

  .contact{
    position:absolute; left:50%; bottom:1.5%;
    width:52%; height:10%;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(50% 50% at 50% 50%,
      rgba(38,25,14,.40), rgba(38,25,14,.15) 54%, rgba(38,25,14,0) 78%);
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  /* --------------------------------------------- name under the stage */

  .title{ display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; padding:0 4px; }

  .title h1{
    margin:0;
    font-size:clamp(27px, 7.6vw, 40px);
    line-height:1.06;
    font-weight:800;
    letter-spacing:-.012em;
  }

  .title p{
    margin:0;
    font-size:16.5px;
    font-weight:550;
    color:var(--ink-70);
    text-wrap:balance;
  }

  .title .hint{
    margin:0; text-align:center;
    font-size:13px; font-weight:600; letter-spacing:.01em;
    color:var(--ink-45);
    transition:opacity .3s ease;
  }
  .title .hint.gone{ opacity:0; }

  /* --------------------------------------------------- rung filmstrip */

  .strip{
    display:grid; grid-template-columns:repeat(5,1fr);
    gap:6px; align-items:end;
    padding:12px 4px 2px;
  }

  .rung{
    -webkit-appearance:none; appearance:none;
    border:0; background:transparent; padding:0; margin:0;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    transition:transform .18s ease;
  }

  .chip{
    position:relative;
    display:grid; place-items:center;
    width:100%; aspect-ratio:.72;
    max-height:clamp(64px, 10.5vh, 116px);
    border-radius:var(--r-md);
    background:var(--screen);
    overflow:hidden;
    box-shadow:0 0 0 2.5px var(--ink), 0 14px 22px -18px rgba(38,25,14,.95);
    transition:box-shadow .18s ease, max-height .18s ease;
  }

  .chip img{ display:block; width:100%; height:100%; object-fit:contain; }

  .num{
    position:absolute; left:5px; top:5px;
    font-size:13px; font-weight:800; line-height:1;
    padding:3px 6px 4px;
    border-radius:9px;
    background:rgba(255,255,255,.86);
    color:var(--ink-70);
  }

  .rname{
    font-size:13px; font-weight:650; color:var(--ink-45);
    max-width:100%; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .rung[aria-pressed="true"]{ transform:translateY(-7px) scale(1.05); }

  .rung[aria-pressed="true"] .chip{
    max-height:clamp(74px, 12.5vh, 130px);
    box-shadow:0 0 0 3px var(--gold), 0 0 0 6px var(--ink), 0 18px 26px -16px rgba(38,25,14,.95);
  }

  .rung[aria-pressed="true"] .rname{ color:var(--ink); }

  @media (max-width:619px){
    .rname{ display:none; }
  }

  /* ---------------------------------------------- customize glass row */

  .panel{
    display:grid; gap:0;
    width:100%; max-width:600px; margin:0 auto;
    padding:8px 14px;
    border-radius:var(--r-lg);
    background:linear-gradient(152deg, rgba(255,255,255,.82), rgba(255,255,255,.5));
    box-shadow:
      0 0 0 2.5px var(--ink-12),
      0 24px 40px -34px rgba(38,25,14,.9),
      inset 0 1px 0 rgba(255,255,255,.95);
    -webkit-backdrop-filter:blur(18px) saturate(1.6);
    backdrop-filter:blur(18px) saturate(1.6);
  }

  @supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
    .panel{ background:rgba(255,255,255,.92); }
  }

  .field{
    display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:12px;
    padding:4px 0;
    border-top:1.5px solid rgba(38,25,14,.09);
  }

  .field:first-child{ border-top:0; }

  .lab{ font-size:14px; font-weight:700; color:var(--ink-70); }

  .field .seg{ justify-self:end; }

  /* ------------------------------------------------------- send row */

  .send{
    display:flex; flex-direction:column; align-items:center; gap:9px;
    width:100%; max-width:600px; margin:0 auto;
  }

  .players{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; width:100%; max-width:420px; }

  @media (min-width:720px){
    .players{ grid-template-columns:repeat(4,minmax(0,1fr)); max-width:560px; }
  }

  .pchip{
    -webkit-appearance:none; appearance:none;
    border:2.5px solid var(--ink);
    background:#fffaf0;
    border-radius:var(--r-pill);
    padding:9px 4px;
    font-size:clamp(13px, 3.4vw, 15.5px); font-weight:700;
    letter-spacing:-.005em;
    cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    box-shadow:0 8px 14px -12px rgba(38,25,14,.95);
    transition:transform .14s ease, background .14s ease, box-shadow .14s ease;
  }

  .pchip[aria-checked="true"]{
    background:var(--gold);
    box-shadow:0 0 0 2.5px var(--ink), 0 10px 16px -11px rgba(38,25,14,.95);
    transform:translateY(-2px);
  }

  .pchip:active{ transform:translateY(1px) scale(.985); }

  .btn-send{
    -webkit-appearance:none; appearance:none;
    position:relative;
    width:100%; max-width:520px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    min-height:58px;
    padding:10px 18px;
    border:var(--line);
    border-radius:24px;
    background:var(--persimmon);
    color:#fff8ee;
    font-size:19px; font-weight:750; letter-spacing:.005em;
    cursor:pointer;
    box-shadow:0 7px 0 rgba(38,25,14,.22), 0 22px 34px -26px rgba(38,25,14,.9);
    transition:transform .14s ease, box-shadow .14s ease, background .2s ease;
  }

  .btn-send:active{ transform:translateY(4px); box-shadow:0 3px 0 rgba(38,25,14,.22); }

  .btn-send .sub,
  .btn-send .main{ display:block; }

  .btn-send .sub{ font-size:15px; font-weight:650; opacity:.92; }

  .btn-send.is-idle{
    background:#fffaf0; color:var(--ink-70);
    box-shadow:0 7px 0 rgba(38,25,14,.14), 0 22px 34px -28px rgba(38,25,14,.6);
  }

  .btn-send.is-sent{
    background:linear-gradient(158deg,#e6ffc8, var(--lime));
    color:var(--ink);
    cursor:default;
    box-shadow:0 0 0 2.5px rgba(38,25,14,.18), 0 20px 30px -26px rgba(38,25,14,.7);
    animation:pop .34s cubic-bezier(.16,1,.3,1) both;
  }

  .btn-send:disabled{ opacity:1; color:var(--ink); -webkit-text-fill-color:var(--ink); }

  @keyframes pop{ from{ transform:scale(.965); } to{ transform:scale(1); } }

  .btn-send .tick{ width:20px; height:20px; display:block; margin-bottom:1px; }

  .link{
    -webkit-appearance:none; appearance:none;
    border:0; background:transparent; cursor:pointer;
    padding:6px 10px;
    font-size:15px; font-weight:700;
    color:var(--ink-70);
    text-decoration:underline;
    text-underline-offset:3px;
    text-decoration-thickness:2px;
  }

  .link:hover{ color:var(--ink); }

  [hidden]{ display:none !important; }

  /* ------------------------------------------------------ wide layout */

  @media (min-width:720px){
    .title{ flex-direction:row; align-items:baseline; justify-content:center; gap:14px; flex-wrap:wrap; }
    .title h1{ font-size:40px; }
    .title p{ font-size:17px; }

    /* the build controls fold into one quiet row inside the same glass slab */
    .panel{ grid-template-columns:repeat(3,minmax(0,1fr)); padding:12px 6px; max-width:680px; }
    .field{
      grid-template-columns:minmax(0,1fr); gap:6px;
      padding:0 8px; text-align:center;
      border-top:0; border-left:1.5px solid rgba(38,25,14,.09);
    }
    .field:first-child{ border-left:0; }
    .field .seg{ justify-self:stretch; max-width:none; }
  }

  @media (min-height:900px){
    .plinth{ width:min(100%,470px); }
  }

  /* -------------------------------------------- reduced motion escape */

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
    .fig img, .hint, .rung, .chip, .pchip, .btn-send{ transition-duration:.001ms !important; }
    .btn-send.is-sent{ animation:none; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="bar">
    <p class="mark">Steam Circuit Padel</p>
    <div class="seg" id="setSwitch" role="radiogroup" aria-label="Racket set">
      <button class="opt" type="button" role="radio" aria-checked="true" data-set="0">Steampunk</button>
      <button class="opt" type="button" role="radio" aria-checked="false" data-set="1">Country</button>
    </div>
  </header>

  <main class="stage-zone">
    <div class="stage" id="stage">
      <div class="plinth">
        <div class="screen">
          <div class="fig" id="fig">
            <img id="racket" alt="" width="1024" height="1536" decoding="async" fetchpriority="high" />
          </div>
          <div class="contact" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="title">
      <h1 id="rName">Lo Sfiato</h1>
      <p id="rLine">Vents steam to hide your shot.</p>
      <p class="hint" id="hint">Drag to spin. Tap to pause, hold to keep turning.</p>
    </div>
  </main>

  <section class="strip" id="strip" aria-label="Rackets in this set"></section>

  <section class="panel" aria-label="Build">
    <div class="field">
      <span class="lab" id="lab-grip">Grip</span>
      <div class="seg vetro" role="radiogroup" aria-labelledby="lab-grip" data-field="0">
        <button class="opt" type="button" role="radio" aria-checked="true" data-v="0">Cloth tape</button>
        <button class="opt" type="button" role="radio" aria-checked="false" data-v="1">Vulcanized</button>
      </div>
    </div>
    <div class="field">
      <span class="lab" id="lab-strings">Strings</span>
      <div class="seg vetro" role="radiogroup" aria-labelledby="lab-strings" data-field="1">
        <button class="opt" type="button" role="radio" aria-checked="true" data-v="0">Gut</button>
        <button class="opt" type="button" role="radio" aria-checked="false" data-v="1">Bronze wound</button>
      </div>
    </div>
    <div class="field">
      <span class="lab" id="lab-special">Special</span>
      <div class="seg vetro" role="radiogroup" aria-labelledby="lab-special" data-field="2">
        <button class="opt" type="button" role="radio" aria-checked="true" data-v="0">Vent</button>
        <button class="opt" type="button" role="radio" aria-checked="false" data-v="1">Silent</button>
      </div>
    </div>
  </section>

  <section class="send" aria-label="Send to player">
    <div class="players" id="players" role="radiogroup" aria-label="Player"></div>
    <button class="btn-send is-idle" id="sendBtn" type="button">Pick a player</button>
    <button class="link" id="resetBtn" type="button" hidden>Start over</button>
  </section>

  <p class="sr" id="live" role="status" aria-live="polite"></p>
</div>

<script>
(function(){
  'use strict';

  /* -------------------------------------------------------------- data */

  var SETS = [
    { label:'Steampunk', items:[
      { img:'assets/rackets/sfiato-front.png',        name:'Lo Sfiato',        line:'Vents steam to hide your shot.',            build:[0,0,0] },
      { img:'assets/rackets/scatto-front.png',        name:'Lo Scatto',        line:'Snaps the ball before the sound arrives.',  build:[1,0,0] },
      { img:'assets/rackets/campanone-front.png',     name:'Il Campanone',     line:'Rings the bell on every smash.',            build:[0,1,0] },
      { img:'assets/rackets/novilunio-front.png',     name:'Il Novilunio',     line:'Moonless dark, so the drop shot lands unseen.', build:[0,0,1] },
      { img:'assets/rackets/orsa-maggiore-front.png', name:'L Orsa Maggiore',  line:'Follows seven stars into the corner.',     build:[1,0,0] }
    ]},
    { label:'Country', items:[
      { img:'assets/rackets/capezza-front.png',   name:'La Capezza',        line:'Reins in your wildest swing.',                 build:[0,1,0] },
      { img:'assets/rackets/bottone-front.png',   name:'Il Bottone',        line:'One press and the rally flips.',               build:[0,0,1] },
      { img:'assets/rackets/marchio-front.png',   name:'Il Marchio',        line:'Signs every lob at the back glass.',           build:[1,1,0] },
      { img:'assets/rackets/alambicco-front.png', name:'L Alambicco',       line:'Distills your serve into one clean drop.',     build:[1,1,1] },
      { img:'assets/rackets/bisonte-front.png',   name:'Il Bisonte Bianco', line:'Heavy, slow to wake, hard to stop.',           build:[0,0,0] }
    ]}
  ];

  var PLAYERS = ['Il Maestro','Lo Steamer','La Volpe','Il Colosso'];
  var NUMERALS = ['I','II','III','IV','V'];

  /* ------------------------------------------------------------- state */

  var state = {
    set: 0,
    rung: [0, 0],                 /* remembered rung per set */
    build: {},                    /* key "set-rung" to [grip, strings, special] */
    player: null,
    sent: false
  };

  var view = { angle: 5, tilt: -1.5, paused:false, dragging:false, hold:false, moved:false, down:0, x:0, y:0 };

  var reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = reduceQuery.matches;

  /* ------------------------------------------------------------ dom refs */

  var $ = function(id){ return document.getElementById(id); };
  var stageEl = $('stage'), figEl = $('fig'), imgEl = $('racket'), contactEl = document.querySelector('.contact');
  var nameEl = $('rName'), lineEl = $('rLine'), stripEl = $('strip'), hintEl = $('hint');
  var playersEl = $('players'), sendBtn = $('sendBtn'), resetBtn = $('resetBtn'), liveEl = $('live');
  var setOpts = Array.prototype.slice.call(document.querySelectorAll('#setSwitch .opt'));
  var fields = Array.prototype.slice.call(document.querySelectorAll('.panel .seg[data-field]'));

  /* ------------------------------------------------------- helpers */

  function currentSet(){ return SETS[state.set]; }
  function currentItem(){ return currentSet().items[state.rung[state.set]]; }
  function buildKey(){ return state.set + '-' + state.rung[state.set]; }

  function currentBuild(){
    var k = buildKey();
    if (!state.build[k]) state.build[k] = currentItem().build.slice();
    return state.build[k];
  }

  function labelFor(fieldIndex, valueIndex){
    return fields[fieldIndex].querySelectorAll('.opt')[valueIndex].textContent;
  }

  /* ------------------------------------------------------- rendering */

  function renderStrip(){
    var items = currentSet().items, idx = state.rung[state.set];
    var html = '';
    for (var i = 0; i < items.length; i++){
      html += '<button class="rung" type="button" data-i="' + i + '" aria-pressed="' + (i === idx) + '"' +
              ' aria-label="Rung ' + NUMERALS[i] + ', ' + items[i].name + '">' +
              '<span class="chip"><img src="' + items[i].img + '" alt="" width="1024" height="1536"' +
              ' loading="' + (i === idx ? 'eager' : 'lazy') + '" decoding="async" />' +
              '<span class="num" aria-hidden="true">' + NUMERALS[i] + '</span></span>' +
              '<span class="rname">' + items[i].name + '</span>' +
              '</button>';
    }
    stripEl.innerHTML = html;
    stripEl.setAttribute('aria-label', 'Rackets in the ' + currentSet().label + ' set');
  }

  function renderRacket(withFade){
    var item = currentItem();
    nameEl.textContent = item.name;
    lineEl.textContent = item.line;

    var swap = function(){
      imgEl.src = item.img;
      imgEl.alt = item.name + ', front view';
      imgEl.classList.remove('swapping');
    };

    if (withFade && !reduced){
      imgEl.classList.add('swapping');
      var primer = new Image();
      primer.decoding = 'async';
      primer.onload = function(){ window.setTimeout(swap, 60); };
      primer.onerror = swap;
      primer.src = item.img;
    } else {
      swap();
    }

    renderBuild();
  }

  function renderBuild(){
    var b = currentBuild();
    for (var f = 0; f < fields.length; f++){
      var opts = fields[f].querySelectorAll('.opt');
      for (var v = 0; v < opts.length; v++){
        opts[v].setAttribute('aria-checked', String(b[f] === v));
      }
    }
  }

  function renderPlayers(){
    var html = '';
    for (var i = 0; i < PLAYERS.length; i++){
      html += '<button class="pchip" type="button" role="radio" aria-checked="' +
              (state.player === PLAYERS[i]) + '" data-p="' + PLAYERS[i] + '">' + PLAYERS[i] + '</button>';
    }
    playersEl.innerHTML = html;
  }

  function renderSend(pop){
    if (state.sent){
      var b = currentBuild();
      sendBtn.className = 'btn-send';
      if (pop && !reduced){ void sendBtn.offsetWidth; }   /* restart the pop */
      sendBtn.classList.add('is-sent');
      sendBtn.innerHTML =
        '<svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.6 9.4 18 20 6.6" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<span class="main">Sent to ' + state.player + '</span>' +
        '<span class="sub">' + currentItem().name + '</span>';
      sendBtn.disabled = true;
      resetBtn.hidden = false;
      liveEl.textContent = 'Sent ' + currentItem().name + ' to ' + state.player + '. Build: ' +
        labelFor(0, b[0]) + ', ' + labelFor(1, b[1]) + ', ' + labelFor(2, b[2]) + '.';
    } else {
      var armed = !!state.player;
      sendBtn.className = 'btn-send' + (armed ? '' : ' is-idle');
      sendBtn.innerHTML = armed ? '<span class="main">Send racket</span>' : '<span class="main">Pick a player</span>';
      sendBtn.disabled = false;
      resetBtn.hidden = true;
      if (pop) liveEl.textContent = 'Racket ready for ' + state.player + '.';
    }
  }

  function renderAll(){
    renderStrip();
    renderRacket(false);
    renderPlayers();
    renderSend(false);
  }

  /* ------------------------------------------------------- 3D stage */

  var raf = null;

  function paint(){
    var rad = view.angle * Math.PI / 180;
    figEl.style.transform = 'rotateX(' + view.tilt.toFixed(2) + 'deg) rotateY(' + view.angle.toFixed(2) + 'deg)';
    contactEl.style.transform = 'translateX(-50%) scaleX(' + (1 - 0.16 * Math.abs(Math.sin(rad))).toFixed(3) + ')';
  }

  function frame(t){
    if (!frame.last) frame.last = t;
    var dt = Math.min(50, t - frame.last);
    frame.last = t;
    if (!view.dragging){
      var rate = view.hold ? 1.05 : 0.24;       /* degrees per 16.7ms */
      view.angle += rate * (dt / 16.7);
    }
    paint();
    raf = requestAnimationFrame(frame);
  }

  function syncLoop(){
    var spinning = !reduced && (!view.paused || view.hold);
    if (spinning && raf === null){ frame.last = 0; raf = requestAnimationFrame(frame); }
    if (!spinning && raf !== null){ cancelAnimationFrame(raf); raf = null; }
  }

  function setPaused(next){
    view.paused = next;
    syncLoop();
  }

  var HOLD_MS = 320;

  stageEl.addEventListener('pointerdown', function(e){
    if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
    view.dragging = true;
    view.moved = false;
    view.down = performance.now();
    view.x = e.clientX; view.y = e.clientY;
    stageEl.classList.add('is-dragging');
    if (stageEl.setPointerCapture){ try { stageEl.setPointerCapture(e.pointerId); } catch(err){} }
    view.holdTimer = window.setTimeout(function(){
      if (view.dragging && !view.moved){ view.hold = true; syncLoop(); }
    }, HOLD_MS);
  });

  stageEl.addEventListener('pointermove', function(e){
    if (!view.dragging) return;
    var dx = e.clientX - view.x, dy = e.clientY - view.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) view.moved = true;
    view.x = e.clientX; view.y = e.clientY;
    view.angle += dx * 0.5;
    view.tilt = Math.max(-9, Math.min(9, view.tilt + dy * 0.14));
    paint();
    if (view.moved && !hintEl.classList.contains('gone')) hintEl.classList.add('gone');
  });

  function endDrag(e){
    if (!view.dragging) return;
    view.dragging = false;
    stageEl.classList.remove('is-dragging');
    window.clearTimeout(view.holdTimer);
    var wasHold = view.hold;
    view.hold = false;
    if (!wasHold && !view.moved && (performance.now() - view.down) < 300){
      setPaused(!view.paused);                     /* quick tap toggles the idle spin */
    } else {
      syncLoop();
    }
    if (e && e.pointerId !== undefined && stageEl.releasePointerCapture){
      try { stageEl.releasePointerCapture(e.pointerId); } catch(err){}
    }
  }

  stageEl.addEventListener('pointerup', endDrag);
  stageEl.addEventListener('pointercancel', endDrag);

  reduceQuery.addEventListener && reduceQuery.addEventListener('change', function(e){
    reduced = e.matches;
    if (reduced){ view.paused = true; syncLoop(); paint(); }
    else syncLoop();
  });

  /* ------------------------------------------------------ interactions */

  function select(setIndex, rung, opts){
    opts = opts || {};
    state.set = setIndex;
    state.rung[setIndex] = rung;
    if (!state.build[buildKey()]) state.build[buildKey()] = currentItem().build.slice();

    for (var i = 0; i < setOpts.length; i++){
      setOpts[i].setAttribute('aria-checked', String(i === setIndex));
    }
    if (opts.keepSend !== true){ state.sent = false; }

    renderStrip();
    renderRacket(true);
    renderSend(false);
  }

  setOpts.forEach(function(btn, i){
    btn.addEventListener('click', function(){
      if (state.set === i) return;
      select(i, state.rung[i]);
    });
  });

  stripEl.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.rung') : null;
    if (!btn) return;
    var i = Number(btn.getAttribute('data-i'));
    if (i === state.rung[state.set]) return;
    select(state.set, i);
  });

  fields.forEach(function(seg, f){
    seg.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('.opt') : null;
      if (!btn) return;
      var v = Number(btn.getAttribute('data-v'));
      currentBuild()[f] = v;
      renderBuild();
      if (state.sent){ state.sent = false; }
      renderSend(false);
    });
  });

  playersEl.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.pchip') : null;
    if (!btn) return;
    state.player = btn.getAttribute('data-p');
    state.sent = false;
    renderPlayers();
    renderSend(false);
  });

  sendBtn.addEventListener('click', function(){
    if (state.sent || !state.player) return;
    state.sent = true;
    renderSend(true);
  });

  resetBtn.addEventListener('click', function(){
    state.sent = false;
    state.player = null;
    renderPlayers();
    renderSend(false);
    liveEl.textContent = 'Send cleared.';
  });

  document.addEventListener('keydown', function(e){
    var t = e.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    if (typing) return;

    if (e.key === 'Escape'){
      if (state.sent || state.player){ state.sent = false; state.player = null; renderPlayers(); renderSend(false); liveEl.textContent = 'Send cleared.'; }
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      var items = currentSet().items;
      var step = e.key === 'ArrowRight' ? 1 : -1;
      var next = (state.rung[state.set] + step + items.length) % items.length;
      e.preventDefault();
      select(state.set, next);
    }
  });

  /* ------------------------------------------------------------- boot */

  renderAll();
  syncLoop();

  if (!reduced) window.setTimeout(function(){
    var idle = window.requestIdleCallback || function(fn){ window.setTimeout(fn, 300); };
    idle(function(){
      for (var s = 0; s < SETS.length; s++){
        for (var i = 0; i < SETS[s].items.length; i++){
          var im = new Image();
          im.decoding = 'async';
          im.src = SETS[s].items[i].img;
        }
      }
    });
  }, 900);
})();
</script>
</body>
</html>
