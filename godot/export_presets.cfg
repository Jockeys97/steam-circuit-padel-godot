; export_presets.cfg — Steam Circuit Padel Pro (Godot 4.7.2 port), slice S12.
;
; Three presets, all Linux/x86_64, because the product-scope decision
; (`docs/wayfinder/tickets/product-scope-and-platforms.md`) has not named the OS
; set yet: only Linux is produced, and the missing targets are recorded as
; blocked in `docs/wayfinder/evidence/demo-and-export.md` rather than guessed at.
;
;   0. linux-x86_64                 — the desktop build. Full game, every athlete,
;                                     every arena, every mode.
;   1. linux-x86_64-demo            — the demo build. Same resources, one
;                                     difference: `custom_features="demo"`, which
;                                     is what `res://tests/build/BuildFlag.gd`
;                                     reads. The demo cuts progression, not the
;                                     game, so it deletes no content file — the
;                                     content rule is a filter, not a copy of the
;                                     repository.
;   2. linux-x86_64-demo-selfcheck  — the demo build with the demo's own content
;                                     report as its main scene. The gate is
;                                     proved by the built thing asserting on
;                                     itself, not by this file existing.
;
; MAIN SCENE. `godot/project.godot` keeps `run/main_scene="res://tests/SmokeTest.tscn"`
; on purpose — the headless harness command depends on it — so a preset must
; carry its own rather than the project setting be changed. Godot 4.7.2 has no
; "main scene" field in an export preset; the two mechanisms it does document are
; used together, and which one actually decided the boot scene was measured on
; the artifact (see the evidence file, "main scene forensics"):
;
;   * the preset option `application/main_scene` (below), and
;   * `override.cfg` next to the exported binary, which ProjectSettings documents
;     as overriding project settings in an exported project
;     (https://docs.godotengine.org/en/4.7/classes/class_projectsettings.html).
;
; Both are written to the same path per preset, so the boot scene is the same
; whether or not the engine honours the preset option.
;
; PCK LAYOUT. `binary_format/embed_pck=false`: binary + `.pck` side by side. The
; pack stays inspectable and hashable as its own artifact, and shell/codesign
; steps later have one file to sign instead of a 70 MB blob that also contains
; the pack. The reference makes the same "what ships is a selection" decision in
; `scripts/build-dist.mjs`; here the selection is the export filter plus the
; demo's runtime filter.
;
; INCLUDED / EXCLUDED. `*.json` is in `include_filter` because Godot packs JSON
; only when asked, and `res://src/sim/frozen/data.json` (the frozen tables) and
; `res://tests/build/demo_content.json` (the demo table) are JSON: without it the
; exported game would have no content at all. `res://prototypes/*` is excluded:
; those are separate scratch projects (their own `project.godot`), not the game.
; Exclusion is verified on the artifact, not asserted here — the shipped pack is
; listed in the evidence file.

